<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>galexp3 — 4X space game</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06070b;
        --fg: #d4d6db;
        --muted: #8a8f99;
        --accent: #6fb8ff;
        --border: #1d2230;
        --panel: #0d1018;
      }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.45; }
      header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 14px; }
      header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
      header .subtitle { color: var(--muted); font-size: 12px; }
      main { padding: 20px; max-width: 1100px; margin: 0 auto; }
      .row { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      button { background: var(--panel); color: var(--fg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
      button:hover { border-color: var(--accent); color: var(--accent); }
      select { background: var(--panel); color: var(--fg); border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px; font-size: 13px; }
      .stat { display: inline-block; padding: 2px 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 3px; font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: var(--muted); }
      .stat b { color: var(--fg); font-weight: 600; }
      #galaxy-json { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 12px; max-height: 320px; overflow: auto; font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; line-height: 1.4; white-space: pre; color: var(--muted); }
      #status { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 16px; }
      #status.ok { color: #6bd58f; }
      #status.err { color: #ff7b7b; }
    </style>
  </head>
  <body>
    <header>
      <h1>galexp3</h1>
      <span class="subtitle">Iteration 1a — galaxy data model boot test</span>
    </header>
    <main>
      <div class="row">
        <label for="size-select">Galaxy size:</label>
        <select id="size-select">
          <option value="Small">Small (24 stars)</option>
          <option value="Medium">Medium (33 stars)</option>
          <option value="Large" selected>Large (48 stars)</option>
          <option value="Huge">Huge (72 stars)</option>
        </select>
        <label for="seed-input">Seed:</label>
        <input id="seed-input" type="number" value="42" style="background:var(--panel);color:var(--fg);border:1px solid var(--border);padding:5px 8px;border-radius:4px;font-size:13px;width:110px;" />
        <button id="generate-btn">Generate</button>
        <button id="random-seed-btn">Random seed</button>
        <span id="stat-count" class="stat">stars: <b>–</b></span>
        <span id="stat-radius" class="stat">radius: <b>–</b></span>
        <span id="stat-valid" class="stat">isValidGalaxy: <b>–</b></span>
      </div>
      <div id="galaxy-json">// Click "Generate" to build a galaxy.</div>
      <div id="status">Ready.</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
