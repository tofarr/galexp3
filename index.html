<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>galexp3 — 4X space game</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06070b;
        --fg: #d4d6db;
        --muted: #8a8f99;
        --accent: #6fb8ff;
        --border: #1d2230;
        --panel: #0d1018;
        --panel-2: #11151f;
      }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.45; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* ---- shared header ---- */
      header.app-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      header.app-header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
      header.app-header .subtitle { color: var(--muted); font-size: 12px; }
      header.app-header .spacer { flex: 1; }

      /* ---- views ---- */
      .view.hidden { display: none !important; }
      .hidden { display: none !important; }

      /* ---- menu view ---- */
      #menu-view {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 49px); /* viewport minus header */
        padding: 40px 20px;
        overflow: hidden;
      }
      /* PixiJS canvas mounts into #menu-bg; positioned to fill the menu view. */
      #menu-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: #02030a;
      }
      #menu-bg canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* ---- CSS vortex fallback (used when WebGL is unavailable) ----
         Three stacked layers:
           .vortex-stars  — sparse white dots on dark base
           .vortex-swirl  — conic gradient rotated slowly (the "spiral")
           .vortex-glow   — soft radial bloom at the centre
         All animation is CSS transform-only — no per-frame JS.        */
      .vortex-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .vortex-bg > div { position: absolute; inset: 0; }
      .vortex-stars {
        background:
          radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 84% 26%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 33% 71%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 67% 84%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 50%  8%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 22% 47%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 78% 56%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 41% 92%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 90% 73%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at  5% 88%, #fff 50%, transparent 51%),
          radial-gradient(2px 2px at 60% 38%, #b8d0ff 50%, transparent 51%),
          radial-gradient(2px 2px at 28% 12%, #ffd2a8 50%, transparent 51%),
          radial-gradient(1px 1px at 70% 60%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 18% 60%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 96% 44%, #fff 50%, transparent 51%);
        opacity: 0.85;
      }
      .vortex-swirl {
        background:
          conic-gradient(
            from 0deg at 50% 50%,
            #0a0d1c 0deg,
            #1b2a55 35deg,
            #6b3a8c 75deg,
            #c34f7a 120deg,
            #f08a3c 160deg,
            #1b2a55 200deg,
            #0a0d1c 250deg,
            #1b2a55 300deg,
            #0a0d1c 360deg
          );
        mix-blend-mode: screen;
        opacity: 0.55;
        transform-origin: 50% 50%;
        animation: vortex-spin 28s linear infinite;
        filter: blur(22px);
      }
      .vortex-glow {
        background: radial-gradient(
          ellipse at 50% 50%,
          rgba(255, 200, 140, 0.35) 0%,
          rgba(80, 30, 120, 0.18) 30%,
          rgba(0, 0, 0, 0) 65%
        );
        animation: vortex-pulse 7s ease-in-out infinite alternate;
      }
      @keyframes vortex-spin {
        from { transform: rotate(0deg)   scale(1.05); }
        to   { transform: rotate(360deg) scale(1.20); }
      }
      @keyframes vortex-pulse {
        from { opacity: 0.70; transform: scale(1.0); }
        to   { opacity: 1.00; transform: scale(1.15); }
      }
      .menu-card {
        position: relative;
        z-index: 1;
        max-width: 460px;
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 32px;
        text-align: center;
      }
      .menu-card .game-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 4px 0;
        background: linear-gradient(180deg, #d6e6ff 0%, #6fb8ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .menu-card .game-tagline {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      .menu-card .menu-buttons { display: flex; flex-direction: column; gap: 10px; }
      .menu-card button.menu-btn {
        background: var(--panel-2);
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 14px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.04em;
        transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
        text-align: left;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .menu-card button.menu-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--panel);
      }
      .menu-card button.menu-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        border-color: var(--border);
        color: var(--muted);
      }
      .menu-card button.menu-btn .label { font-size: 15px; }
      .menu-card button.menu-btn .hint {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.03em;
        margin-top: 2px;
        font-weight: 400;
      }
      .menu-card .menu-footer {
        margin-top: 22px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      /* ---- game view ---- */
      main { padding: 20px; max-width: 1100px; margin: 0 auto; }
      .row { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      button {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      select { background: var(--panel); color: var(--fg); border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px; font-size: 13px; }
      .stat { display: inline-block; padding: 2px 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 3px; font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: var(--muted); }
      .stat b { color: var(--fg); font-weight: 600; }
      #galaxy-json { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 12px; max-height: 320px; overflow: auto; font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; line-height: 1.4; white-space: pre; color: var(--muted); }
      #status { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 16px; }
      #status.ok { color: #6bd58f; }
      #status.err { color: #ff7b7b; }
      .back-link { font-size: 12px; color: var(--muted); }

      /* ---- starmap (iter 1b) ---- */
      .starmap-host {
        position: relative;
        width: 100%;
        height: 520px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 14px;
      }
      #starmap-canvas { position: absolute; inset: 0; }
      #starmap-canvas canvas { display: block; width: 100% !important; height: 100% !important; }
      #sidepanel-host { position: absolute; inset: 0; pointer-events: none; }
      .starmap-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>galexp3</h1>
      <span class="subtitle" id="header-subtitle">Iteration 1a — galaxy data model</span>
      <span class="spacer"></span>
      <a href="#" id="back-link" class="back-link hidden">← Back to menu</a>
    </header>

    <!-- ====================================================================
         Menu view (default landing)
         ==================================================================== -->
    <section id="menu-view" class="view" aria-label="Main menu">
      <div id="menu-bg" aria-hidden="true"></div>
      <div class="menu-card" role="dialog" aria-labelledby="game-title">
        <h2 id="game-title" class="game-title">Galactic Expansion</h2>
        <div class="game-tagline">4X Space Strategy</div>
        <div class="menu-buttons">
          <button id="new-game-btn" class="menu-btn" type="button">
            <span class="label">New Game</span>
            <span class="hint">Generate a fresh galaxy and begin a new empire.</span>
          </button>
          <button id="load-game-btn" class="menu-btn" type="button">
            <span class="label">Load Game</span>
            <span class="hint">Resume a saved game. (Not yet implemented.)</span>
          </button>
        </div>
        <div class="menu-footer">v0.0.3 · Iteration 1c</div>
      </div>
    </section>

    <!-- ====================================================================
         Game view (entered via menu)
         ==================================================================== -->
    <section id="game-view" class="view hidden" aria-label="Game view">
      <main>
        <div class="row">
          <label for="size-select">Galaxy size:</label>
          <select id="size-select">
            <option value="Small">Small (24 stars)</option>
            <option value="Medium">Medium (33 stars)</option>
            <option value="Large" selected>Large (48 stars)</option>
            <option value="Huge">Huge (72 stars)</option>
          </select>
          <label for="seed-input">Seed:</label>
          <input id="seed-input" type="number" value="42" style="background:var(--panel);color:var(--fg);border:1px solid var(--border);padding:5px 8px;border-radius:4px;font-size:13px;width:110px;" />
          <button id="generate-btn">Generate</button>
          <button id="random-seed-btn">Random seed</button>
          <span id="stat-count" class="stat">stars: <b>–</b></span>
          <span id="stat-radius" class="stat">radius: <b>–</b></span>
          <span id="stat-valid" class="stat">isValidGalaxy: <b>–</b></span>
        </div>

        <!-- Starmap: PixiJS canvas + side panel, anchored relative. -->
        <div id="starmap-host" class="starmap-host">
          <div id="starmap-canvas"></div>
          <div id="sidepanel-host"></div>
        </div>

        <div id="starmap-controls" class="starmap-controls">
          <button id="zoom-in-btn" type="button">Zoom in</button>
          <button id="zoom-out-btn" type="button">Zoom out</button>
          <button id="clear-selection-btn" type="button">Clear selection</button>
          <span id="starmap-status" class="stat">click: <b>–</b></span>
        </div>

        <div id="galaxy-json">// Click "Generate" to build a galaxy.</div>
        <div id="status">Ready.</div>
      </main>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
